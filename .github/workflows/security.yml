name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: a dependency becomes vulnerable without anyone touching the
    # code, so this cannot only run on push.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a key committed and later removed is still a
          # leaked key, and a shallow clone cannot see it.
          fetch-depth: 0

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Audits the pinned production set, not the resolved dev
      # environment — a vulnerable test-only package is not a shipped
      # vulnerability.
      # PYSEC-2026-1325 (ecdsa, Minerva timing attack on P-256) has no
      # fix release. It reaches us transitively through python-jose, but
      # this application signs with HS256 — HMAC, symmetric, no elliptic
      # curve involved — so the vulnerable code path is never entered.
      # tests/unit/test_dependency_exceptions.py asserts that assumption,
      # so switching to an EC algorithm turns the suite red and forces
      # this exception to be revisited. Drop the flag once ecdsa ships a
      # fix.
      - name: Audit production dependencies
        run: |
          pip-audit --requirement requirements.txt --strict             --ignore-vuln PYSEC-2026-1325

  node-dependencies:
    name: Node dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # High and above only. Failing on every low-severity advisory in the
      # transitive tree trains people to ignore the job.
      - name: Audit
        run: npm audit --audit-level=high
