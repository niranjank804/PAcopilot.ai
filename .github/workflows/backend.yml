name: Backend

# Every push and every PR. Two jobs so a style opinion can never block a
# security fix: `verify` gates the merge, `advisory` reports and does not.
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Tests and lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pacopilot
          POSTGRES_PASSWORD: pacopilot
          POSTGRES_DB: pacopilot_test
        ports: ['5432:5432']
        # Without this the first test connects before Postgres accepts.
        options: >-
          --health-cmd "pg_isready -U pacopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: pacopilot_test
      DATABASE_USER: pacopilot
      DATABASE_PASSWORD: pacopilot
      # Test-only values. No real credential belongs in a workflow file;
      # anything genuinely secret comes from GitHub Secrets.
      SECRET_KEY: ci-secret-key-not-used-outside-tests
      DEBUG: 'False'
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Blocking lint: pyflakes only (undefined names, unused imports,
      # syntax errors). Style is the advisory job's business.
      - name: Lint (bug-level rules)
        run: ruff check src tests

      - name: Migration history
        run: python scripts/check_migrations.py --heads-only

      - name: Apply migrations
        run: python -m alembic upgrade head

      # Catches a model column added without a migration, which passes
      # locally on a hand-migrated database and fails on a fresh deploy.
      - name: Migration drift
        run: python scripts/check_migrations.py

      - name: Seed reference data
        run: |
          python scripts/seed_roles.py
          python scripts/seed_permissions.py

      - name: Tests
        run: |
          pytest tests/unit tests/integration \
            --cov=src --cov-report=xml --cov-report=term-missing \
            -p no:logging -q

      # Measures coverage and advisory-lint counts and writes them as an
      # artifact. Not a gate: a threshold chosen before the trend is known
      # either blocks everything or means nothing. `--check` starts
      # enforcing once .coverage-floor.json exists.
      - name: Quality report
        if: matrix.python-version == '3.12'
        run: python scripts/quality_report.py --json quality-report.json --check

      - name: Upload coverage and quality report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality
          path: |
            backend/coverage.xml
            backend/quality-report.json
          retention-days: 90

  advisory:
    name: Style and types (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported for visibility, never a merge gate. The codebase predates
    # both tools; making them blocking today would mean no PR could merge
    # until a large retrofit lands. Ratchet as modules are cleaned up.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Full ruff ruleset
        run: ruff check --select ALL --statistics src || true

      - name: Formatting
        run: ruff format --check src tests || true

      - name: Types
        run: mypy src || true
