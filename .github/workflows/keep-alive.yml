name: Keep the Render backend awake

on:
  schedule:
    # Asks for every 10 minutes, under Render's ~15 minute idle spin-down.
    #
    # Do not rely on it. GitHub treats schedules as best-effort, and in
    # practice this ran every 2-7 hours: the 20 runs before 2026-09-17
    # were 2h01m to 6h54m apart. The backend was therefore asleep most of
    # the time and the first request after a gap waited a minute or more.
    # A dedicated uptime monitor (UptimeRobot, cron-job.org) pinging
    # /health every 5 minutes, or a paid Render instance that never
    # sleeps, is what actually keeps it warm. This stays as a backstop.
    #
    # Off the common minutes on purpose. GitHub runs schedules from a
    # shared queue and the :00/:10/:20 slots are the busiest; measured
    # gaps on "*/10" were 2-5 hours (2026-09-17 to 09-19). Unproven that
    # this helps — compare the run history after a few days.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # /health is the unauthenticated liveness probe: it touches no
      # database and answers the instant the process is up, which is all
      # a keep-alive needs to establish.
      - name: Ping backend
        run: curl -sf -o /dev/null -m 30 https://pa-copilot-backend.onrender.com/health || true

      # Deliberately ONLY the backend. This job used to ping the Render
      # frontend too, and that was actively harmful: a service that is
      # pinged every 10 minutes never spins down, so it runs ~744 hours a
      # month - the entire 750-hour free allowance for the whole
      # workspace, on its own. When the allowance runs out Render suspends
      # every free web service, backend included, until the next month.
      #
      # The frontend is served by Vercel, which does not spin down, so
      # there is nothing there to keep awake. The Render copy should be
      # deleted; until it is, at least nothing here keeps it burning hours.
