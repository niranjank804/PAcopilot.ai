databases:
  - name: pa-copilot-db
    databaseName: enterprise_ai
    plan: free

services:
  - type: web
    name: pa-copilot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      PYTHONPATH=. python -m alembic upgrade head &&
      PYTHONPATH=. python scripts/seed_roles.py &&
      PYTHONPATH=. python scripts/seed_permissions.py &&
      PYTHONPATH=. python scripts/seed_admin.py
    startCommand: >-
      gunicorn src.main:app -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    # Fails the deploy if the new build cannot reach its database, instead
    # of promoting it and serving errors. Saturation deliberately does not
    # fail this probe — see src/api/v1/health.py.
    healthCheckPath: /health/ready
    envVars:
      - key: DEBUG
        value: "False"
      # Session-level org-scoping backstop. On by default in config.py;
      # pinned here so the security posture is visible in the deployment
      # manifest rather than only in a code default that a later refactor
      # could quietly change.
      - key: TENANCY_ENFORCEMENT_ENABLED
        value: "True"
      # Sized per *worker*: --workers 2 means two processes, each with its
      # own pool, so the real connection count against Postgres is twice
      # these numbers (2 x (10 + 10) = 40). Raise only alongside the
      # database plan's own connection limit.
      - key: DATABASE_POOL_SIZE
        value: "10"
      - key: DATABASE_MAX_OVERFLOW
        value: "10"
      - key: DATABASE_HOST
        fromDatabase:
          name: pa-copilot-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: pa-copilot-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: pa-copilot-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: pa-copilot-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: pa-copilot-db
          property: password
      - key: SECRET_KEY
        generateValue: true
      # Set these manually in the Render dashboard after the first deploy —
      # never committed to the repo:
      # Object storage. Set by default because free-tier Postgres is
      # ~0.5GB and report artifacts would consume it quickly. Existing
      # rows keep resolving either way — a reference carries its own
      # scheme, so switching backends orphans nothing.
      - key: S3_BUCKET
        value: pacopilot-s3
      - key: S3_REGION
        value: eu-north-1
      # Resolved by boto3's standard credential chain, not by app
      # config, so no key passes through a settings object. Set these in
      # the Render dashboard — never commit them. Prefer a scoped IAM
      # user limited to s3:GetObject/PutObject/DeleteObject on
      # arn:aws:s3:::pacopilot-s3/*.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TM1_CREDENTIALS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # First-run bootstrap only: creates a default organization (code
      # "default") and a Super Admin account for this email if - and only
      # if - no user with this email exists yet. Safe to leave set
      # permanently; every later deploy just skips it.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      # Without these, get_email_provider() falls back to logging the reset
      # link to the server log instead of emailing it - "forgot password"
      # never actually reaches anyone. SMTP_PORT/SMTP_USE_TLS default to
      # 587/true in config.py already, which matches Gmail's requirements,
      # so only these four need setting.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

  # The frontend is deployed to Vercel, not here — see
  # docs/deployment/FREE-STACK.md.
  #
  # Two reasons. 750 free instance-hours is 31.25 days and a month is up
  # to 744, so one service fits the allowance and two do not. And Vercel
  # runs Next.js natively, including the one dynamic route
  # (/connections/[id]) that would otherwise block a static export.
  #
  # Uncomment to move it back, and expect the allowance to run out
  # mid-month.
  #
  # - type: web
  #   name: pa-copilot-frontend
  #   runtime: node
  #   plan: free
  #   rootDir: frontend
  #   buildCommand: "npm ci && npm run build"
  #   startCommand: "npm run start -- --port $PORT"
  #   envVars:
  #     - key: NEXT_PUBLIC_API_URL
  #       sync: false
  #     - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
  #       sync: false
