[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
markers =
    live: requires a real TM1 server (see backend/docs/live_validation/)
    live_write: writes run-owned fixtures to an authorized DEV/test TM1 server
    live_ai: makes paid model calls; only with LIVE_AI=1
    live_aws: talks to the real S3 bucket; exempt from the storage-pinning fixture
