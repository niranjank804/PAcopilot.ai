# Vercel's Python builder reads this table (it runs `uv lock` on it), so the
# dependencies are requirements.txt's pins, repeated. requirements.txt stays
# the source for Render, CI and local installs;
# tests/unit/test_pyproject_dependencies.py fails if the two drift apart.
[project]
name = "pa-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "annotated-types==0.8.0",
    "anthropic==0.117.0",
    "argon2-cffi-bindings==25.1.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "cryptography==50.0.1",
    "ecdsa==0.19.2",
    "email-validator==2.3.0",
    "et_xmlfile==2.0.0",
    "fastapi==0.141.1",
    "google-auth==2.58.0",
    "greenlet==3.5.6",
    "gunicorn==26.2.0",
    "idna==3.20",
    "ijson==3.5.1",
    "loguru==0.7.3",
    "Mako==1.4.3",
    "MarkupSafe==3.0.3",
    "mdxpy==1.3.2",
    "numpy==2.5.3",
    "openai==2.46.0",
    "openpyxl==3.1.5",
    "passlib==1.7.4",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.13",
    "pyasn1==0.6.4",
    "pycparser==3.0",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "pydantic_core==2.49.0",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "python-dateutil==2.9.0.post0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.3",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "pytz==2026.3.post1",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "rsa==4.9.1",
    "six==1.17.0",
    "SQLAlchemy==2.0.54",
    "TM1py==2.4.1",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "tzdata==2026.4",
    "urllib3==2.8.0",
    "uvicorn==0.53.0",
    "boto3==1.43.100",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
# CI blocks on this set only. "F" is pyflakes — undefined names, unused
# imports, unused variables: things that are wrong regardless of taste.
# Style rules are reported by the advisory job instead, so a formatting
# opinion can never block a security fix from merging.
select = ["F", "E9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["*/alembic/*", "*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Advisory only today. The codebase predates type checking, so enabling
# strict mode as a merge gate would block every PR until a large
# retrofit lands. Ratchet these up as modules are annotated.
check_untyped_defs = false

# Vercel. The app object lives in src/main.py, which Vercel would find on
# its own; naming it keeps that from depending on a filename convention.
# The build script runs after dependencies are installed and before the
# function is deployed: migrations, then seeds, exactly what render.yaml's
# buildCommand did. DATABASE_URL must be set for the build environment.
[tool.vercel]
entrypoint = "src.main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
